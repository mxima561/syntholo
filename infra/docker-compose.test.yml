services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syntholo_test
      POSTGRES_PASSWORD: syntholo
      POSTGRES_USER: syntholo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntholo -d syntholo_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
